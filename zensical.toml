[project]
site_name = "tinymesh"
site_url = "https://spatioterra-ai.github.io/tinymesh/"
site_description = "tinygrad-native learning over sparse structures through space and time"
repo_url = "https://github.com/spatioterra-ai/tinymesh"
repo_name = "spatioterra-ai/tinymesh"
nav = [
  "index.md",
  "quickstart.md",
  "api.md",
  "experiments.md",
  "papers.md",
  "reference-projects.md",
  {"Concepts" = [
    "concepts/topology.md",
    "concepts/message-passing.md",
    "concepts/time.md",
  ]},
  {"Research" = [
    "research/index.md",
    "research/spatial-structure.md",
    "research/spatial-geometry.md",
    "research/directed-diffusion.md",
    "research/sparse-aggregation.md",
    "research/mean-sage.md",
    "research/gcn.md",
    "research/gine.md",
    "research/weighted-aggregation.md",
    "research/attention.md",
    "research/tgcn.md",
    "research/gconv-gru.md",
    "research/jepa-mechanics.md",
    "research/mutag-jepa.md",
    "research/mutag-graph-jepa.md",
    "research/chickenpox-data.md",
    "research/montevideo-data.md",
    "research/metr-la-data.md",
    "research/mutag-data.md",
    "research/metr-la-forecast.md",
    "research/metr-la-diffusion.md",
    "research/metr-la-local-diffusion.md",
    "research/montevideo-forecast.md",
    "research/montevideo-seasonal.md",
    "research/montevideo-delayed-edges.md",
    "research/chickenpox-forecast.md",
    "research/transport-forecast.md",
    "research/transport-transfer.md",
  ]},
]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_section_style = "list"
filters = ["!^_"]
heading_level = 2
inherited_members = false
merge_init_into_class = true
separate_signature = true
show_root_heading = true
show_root_full_path = false
show_signature_annotations = true
show_source = true
show_symbol_type_heading = true
show_symbol_type_toc = true
signature_crossrefs = true
summary = true

[project.validation]
invalid_links = true
invalid_link_anchors = true
